[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-ms"
dynamic = ["version"]
description = "Large-scale tandem mass spectrum clustering"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Wout Bittremieux", email = "wbittremieux@health.ucsd.edu" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "fastcluster>=1.3.0",
    "joblib>=1.3.0",
    "lxml>=4.6.2",
    "natsort>=7.1.0",
    "numba>=0.52.0",
    "numpy>=1.19.4",
    "pandas>=1.2.0",
    "pyarrow>=2.0.0",
    "pydantic>=2.10",
    "pylance>=14.0.3",
    "pyteomics[xml]>=4.4.0",
    "scipy>=1.5.3",
    "spectrum-utils==0.3.5",
]

[project.urls]
Homepage = "https://github.com/bittremieuxlab/falcon"
Repository = "https://github.com/bittremieuxlab/falcon"
Issues = "https://github.com/bittremieuxlab/falcon/issues"

[project.scripts]
falcon = "falcon.cli:main"

[tool.setuptools.packages.find]
include = ["falcon*"]

[tool.setuptools_scm]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "audit" },
]
audit = [
    "pip-audit>=2.10.1",
    "zizmor>=1.33.1",
]
lint = [
    "lxml-stubs>=0.5.1",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle (NumPy convention)
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "ANN401", # allow explicit Any at dynamic boundaries (e.g. Pydantic validators, **kwargs)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",  # annotations are optional in tests
    "D",    # docstrings are optional in tests
    "S101", # assert is expected in tests
]

[tool.ruff.lint.isort]
known-first-party = ["falcon"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 72

[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: end-to-end and Lance-backed integration tests",
]

[tool.coverage.run]
branch = true
source = ["falcon"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    # Numba-compiled kernels cannot be traced by coverage.py in JIT mode.
    "@(nb|numba)\\.njit",
]
