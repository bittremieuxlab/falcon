name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install lint dependencies
        run: uv sync --locked --no-default-groups --group lint

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check --output-format=github .

      - name: Type check with ty
        run: uv run ty check falcon

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run pytest with coverage
        run: >-
          uv run pytest
          --cov=falcon
          --cov-report=term-missing
          --cov-fail-under=95

      - name: Publish coverage summary
        if: >-
          !cancelled() &&
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.12'
        env:
          RUNNER_OS_LABEL: ${{ matrix.os }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Coverage (${RUNNER_OS_LABEL}, Python ${PYTHON_VERSION})"
              echo ""
              uv run coverage report --format=markdown
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build & Smoke Test Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test built wheel CLI and imports
        run: |
          set -- dist/*.whl
          [ "$#" -eq 1 ]
          wheel="$1"
          uv run --isolated --no-project --with "$wheel" falcon --help
          uv run --isolated --no-project --with "$wheel" falcon --version
          uv run --isolated --no-project --with "$wheel" falcon --print-config > /dev/null
          uv run --isolated --no-project --with "$wheel" python -P -c \
            "from pathlib import Path; import falcon, falcon.pipeline, falcon.cluster, falcon.ms_io, falcon.staging; pkg = Path(falcon.__file__).resolve().parent; assert not pkg.is_relative_to(Path.cwd().resolve()), pkg; assert (pkg / 'py.typed').is_file(); assert falcon.__version__ != '0.0.0.dev0'"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install audit dependencies
        run: uv sync --locked --no-default-groups --group audit

      - name: Audit Python dependencies
        run: uv run pip-audit --local --skip-editable

      - name: Audit GitHub Actions workflows
        run: >-
          uv run zizmor --persona=regular --min-severity=medium
          --min-confidence=medium .github/workflows/
